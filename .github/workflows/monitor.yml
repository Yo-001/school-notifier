name: school-monitor
on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry‑run mode'
        required: false
        default: 'false'
jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push state/seen.json
    concurrency:
      group: school-monitor
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor (dry‑run if requested)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python monitor.py --dry-run
          else
            python monitor.py
          fi

      - name: Commit state changes
        if: github.ref == 'refs/heads/main' && steps.run.outcome == 'success'
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add state/seen.json
          if git diff --cached --quiet; then
            echo 'No changes to state/seen.json'
          else
            git commit -m "Update seen IDs [skip ci]"
            git push
          fi
